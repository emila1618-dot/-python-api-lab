
name: Python API Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Uruchom program
        run: python main.py

      - name: Zapisz raport
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: report.json
